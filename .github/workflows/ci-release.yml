# Pipeline to run on release branch only

name: CI - Release
run-name: CI - Release
on:
  workflow_dispatch:
  push:
    branches: ["release"]

jobs:
  tag:
    uses: PSDI-UK/psdi-github-workflows-public/.github/workflows/tag.yml@c0f51fb2cbe8d5e6fcb495549c5eb0063b627558
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  container-push:
    uses: PSDI-UK/psdi-github-workflows-public/.github/workflows/container-push.yml@c0f51fb2cbe8d5e6fcb495549c5eb0063b627558
    needs: [tag]
    with:
      container_tag: ${{ needs.tag.outputs.container_tag }}
      service_name: psdi_common_style
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to Kubernetes Job
  # Requires an environment, which must reflect the target environment as defined in the
  # GitHub repository: https://github.com/PSDI-UK/psdi_common_style/settings/environments
  # The downstream deploy job leverages on Environment specific secrets, which also must be defined
  deploy-stfc-staging-k8s:
    # When ready to enable this step, remove the following line
    if: false
    needs: [tag, container-push]
    uses: PSDI-UK/psdi-github-workflows-public/.github/workflows/deploy.yml@c0f51fb2cbe8d5e6fcb495549c5eb0063b627558
    with:
      container_tag: ${{ needs.tag.outputs.container_tag }}
      deployment_repo: psdi-common-style-deployment
      environment: staging
      prod: false
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      deployment_app_id: ${{ secrets.DEPLOYMENT_APP_ID }}
      deployment_app_private_key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
