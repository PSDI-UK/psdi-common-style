# Workflow for continuous integration tasks triggered on pushes to main

name: CI - Main
run-name: CI - Main
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  container-push:
    uses: PSDI-UK/psdi-github-workflows-public/.github/workflows/container-push.yml@c0f51fb2cbe8d5e6fcb495549c5eb0063b627558
    # When ready to enable this step, remove the following line
    if: false
    with:
      container_tag: ${{ github.sha }}
      service_name: psdi_common_style
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # Deploy to Kubernetes Job
  # Requires an environment, which must reflect the target environment as defined in the
  # GitHub repository: https://github.com/PSDI-UK/psdi-common-style/settings/environments
  # The downstream deploy job leverages on Environment specific secrets, which also must be defined
  # For the tag, we need something unique for each push, so we use the SHA of the latest commit
  deploy-stfc-dev-k8s:
    needs: [container-push]
    uses: PSDI-UK/psdi-github-workflows-public/.github/workflows/deploy.yml@b6c4f4e032d6732d3a0b671532b6787962df408a
    with:
      container_tag: ${{ github.sha }}
      deployment_repo: psdi-common-style-deployment
      environment: development
      prod: false
      test: false
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      deployment_app_id: ${{ secrets.DEPLOYMENT_APP_ID }}
      deployment_app_private_key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
